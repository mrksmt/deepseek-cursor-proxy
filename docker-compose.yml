services:
  # ── Go variant (with ngrok) ──────────────────────────────────────────────
  deepseek-cursor-proxy-ngrok-go:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: deepseek-cursor-proxy-ngrok-go
    restart: unless-stopped
    ports:
      - "${DEEPSEEK_HOST_PORT:-9000}:9000"
      - "4040:4040"
    volumes:
      - deepseek-proxy-data:/data
    environment:
      - DEEPSEEK_HOST=0.0.0.0
      - DEEPSEEK_PORT=9000

      # ── Uncomment to override defaults ──────────────────────────────
      # - DEEPSEEK_MODEL=deepseek-flash
      # - DEEPSEEK_BASE_URL=https://api.deepseek.com
      # - DEEPSEEK_THINKING=enabled
      # - DEEPSEEK_REASONING_EFFORT=max
      - DEEPSEEK_REASONING_EFFORT=medium
      # - DEEPSEEK_DISPLAY_REASONING=true
      # - DEEPSEEK_COLLAPSIBLE_REASONING=true
      # - DEEPSEEK_MISSING_REASONING_STRATEGY=recover
      # - DEEPSEEK_VERBOSE=true
      # - DEEPSEEK_CORS=true
      - DEEPSEEK_REQUEST_TIMEOUT=120
      # - DEEPSEEK_MAX_REQUEST_BODY_BYTES=20971520
      # Trim oldest conversation rounds above this message count (0 disables).
      # Cursor's own window (200k-300k) fills from accumulated history long
      # before DeepSeek's does, so this is what prevents Cursor's silent
      # self-summarization. Soft cap: cuts land on round boundaries.
      # Per-request override via a named model suffix, e.g. "deepseek-flash:mm120".
# Suffix order does not matter: "deepseek-flash:nothink:mm200:low" also works.
      - DEEPSEEK_MAX_MESSAGES=200
      # - DEEPSEEK_MAX_PROMPT_TOKENS=0
      - DEEPSEEK_NGROK=${DEEPSEEK_NGROK:-true}
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
      # Softer heartbeats for large Cursor uploads (see docker-entrypoint.sh).
      - NGROK_HEARTBEAT_INTERVAL=${NGROK_HEARTBEAT_INTERVAL:-45s}
      - NGROK_HEARTBEAT_TOLERANCE=${NGROK_HEARTBEAT_TOLERANCE:-120s}
      # OpenTelemetry tracing via OTLP gRPC.
      # The local collector container owns host port 14317 (-> container 4317),
      # so from inside this container the host address is host.docker.internal:14317.
      - DEEPSEEK_OTEL_ENDPOINT=${DEEPSEEK_OTEL_ENDPOINT:-host.docker.internal:14317}
      - DEEPSEEK_OTEL_SERVICE_NAME=${DEEPSEEK_OTEL_SERVICE_NAME:-deepseek-cursor-proxy-go}

volumes:
  deepseek-proxy-data:
    driver: local
