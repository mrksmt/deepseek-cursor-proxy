# This file was created automatically at ~/.deepseek-cursor-proxy/config.yaml.
# API keys are read from Cursor's Authorization header and forwarded upstream.

# `model` is the fallback when a request has no model; Cursor's requested
# DeepSeek model name is otherwise respected.
base_url: https://api.deepseek.com
model: deepseek-flash
thinking: enabled
reasoning_effort: max
display_reasoning: true
collapsible_reasoning: true

host: 127.0.0.1
port: 9000
ngrok: true
verbose: false
request_timeout: 300
max_request_body_bytes: 20971520
cors: false

reasoning_content_path: reasoning_content.sqlite3
missing_reasoning_strategy: recover
reasoning_cache_max_age_seconds: 2592000
reasoning_cache_max_rows: 100000
max_concurrent_requests: 10

# History truncation. Zero disables the respective limit.
# max_messages trims the oldest conversation rounds once the message count
# exceeds it (system messages and the latest user turn are always kept).
# It is a soft cap: history is cut on round boundaries, so the kept count
# may land below the cap rather than exactly on it. Default: 200.
# It can be overridden per request via a named model name suffix, e.g.
# "deepseek-flash:low:nothink:mm200" or "deepseek-flash:mm300". Suffix order
# does not matter.
# max_prompt_tokens is a coarse secondary guard on estimated prompt size.
# Default: 0 (disabled).
max_messages: 200
max_prompt_tokens: 0
